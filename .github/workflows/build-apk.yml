name: Build SachBite Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate SachBite Delivery Partner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        # uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Production Bundle & Icons
        run: |
          npm run icons
          npm run build

      - name: Install Capacitor CLI & Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npm run icons
          npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        continue-on-error: true

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SachBite-Delivery-Partner-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            dist/
          retention-days: 30
